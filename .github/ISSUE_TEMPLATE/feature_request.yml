name: 需求建议
description: 提出新功能或改进建议，说明使用场景和预期效果。
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景和当前问题
      description: 说明你在什么场景下使用 WeChatMenuBridge、想完成什么，以及目前遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的功能或改进
      description: 描述期望的操作流程和产品行为。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 预期效果与验收条件
      description: 列出可观察的结果，帮助维护者判断这项改进是否解决了问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或补充信息
      description: 可以附上相关 Issue 编号、当前的临时做法或已脱敏的示例。
